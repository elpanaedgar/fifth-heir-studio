<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F4EFE8">
<meta name="apple-mobile-web-app-title" content="Fifth Heir">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Fifth Heir Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EFE8;--panel:#FFFDFA;--ink:#2B2522;--muted:#8B8076;--line:#E7DFD5;--soft:#F7F2EC;--accent:#9C7650;--accent2:#C9A882;--ok:#5E8A5F;--warn:#C28A2B;--bad:#B4483A;--canvas:#FBF8F4;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-rows:58px 1fr;height:100%}
header{display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(255,253,250,.94);border-bottom:1px solid var(--line);z-index:5;min-width:0}
.brand{flex:none;display:flex;flex-direction:column;line-height:1;margin-right:6px}
.brand .mark{font:600 21px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.18em}
.brand .sub{font-size:8.5px;letter-spacing:.42em;color:var(--muted);margin-top:3px}
.pname{border:0;background:none;font-weight:600;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 10px;border-radius:10px}
.pname:hover{background:var(--soft)}
.savestate{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px}
.savestate i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.savestate.cloud i{background:var(--ok)}.savestate.saving i{background:var(--warn)}.savestate.local i{background:var(--bad)}.savestate.local{color:var(--bad);font-weight:500}.savestate.error i{background:var(--bad)}
.grow{flex:1}
.ib{height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;background:none;border-radius:11px;padding:0 9px;color:var(--ink)}
.ib:hover{background:var(--soft)}.ib:disabled{opacity:.3;pointer-events:none}.ib.on{background:var(--ink);color:#fff}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{white-space:nowrap;border:0;background:none;height:34px;padding:0 13px;border-radius:9px;font-weight:500;font-size:13px;display:flex;align-items:center;gap:5px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(60,40,20,.14)}
.seg button.soon{opacity:.45}.seg small{font-size:9px;letter-spacing:.04em;color:var(--muted)}
#main{position:relative;display:grid;grid-template-columns:264px 1fr 312px;min-height:0}
#app.noleft #main{grid-template-columns:0 1fr 312px}#app.noright #main{grid-template-columns:264px 1fr 0}#app.noleft.noright #main{grid-template-columns:0 1fr 0}
aside{background:var(--panel);overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
#app.noleft #left,#app.noright #right{display:none}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;touch-action:pan-y}
.lhead{padding:12px 12px 6px}
.search{width:100%;height:40px;border:1px solid var(--line);border-radius:11px;background:var(--soft);padding:0 12px;outline:none}
.search:focus{border-color:var(--accent2);background:#fff}
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 10px;touch-action:pan-x;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;height:32px;padding:0 12px;white-space:nowrap;font-size:12.5px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.lib{padding:0 10px 14px}
.lsec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 4px 6px}
.card{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:none;border-radius:12px;padding:7px;text-align:left}
.card:hover,.card:active{background:var(--soft);border-color:var(--line)}
.card .th{width:46px;height:46px;border-radius:10px;background:var(--canvas);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.card .th svg{width:38px;height:38px}
.card b{display:block;font-weight:500;font-size:13px;line-height:1.25}
.card small{color:var(--muted);font-size:11.5px}
.tag{display:inline-block;font-size:9.5px;letter-spacing:.06em;border-radius:6px;padding:1px 6px;background:var(--soft);color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.m{background:#F3E9DC;color:#8a6a45}
.btn{height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--accent2)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{height:34px;padding:0 10px;font-size:12.5px;border-radius:10px}
.btn.w{width:100%}
#stage{position:relative;display:grid;grid-template-columns:1fr;min-width:0;min-height:0;background:var(--canvas)}
#app.v-split #stage{grid-template-columns:1fr 1fr}
.pane{position:relative;min-width:0;min-height:0;overflow:hidden}
#app.v-3d #pane2d,#app.v-2d #pane3d{display:none}
#app.v-split #pane2d{border-right:1px solid var(--line)}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:var(--canvas)}
#gl{position:absolute;inset:0;touch-action:none}
#gl canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,253,250,.95);border:1px solid var(--line);border-radius:16px;padding:5px;box-shadow:0 8px 28px rgba(60,40,20,.13);z-index:3;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock .ib{height:44px;min-width:44px;flex-direction:column;gap:1px;font-size:9.5px;padding:0 7px}
.dock .ib span{white-space:nowrap}
.dock .sep{width:1px;background:var(--line);margin:5px 3px;flex:none}
.ptitle{position:absolute;left:12px;top:10px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);z-index:2;pointer-events:none;background:rgba(251,248,244,.8);padding:3px 7px;border-radius:6px}
.topright{position:absolute;right:12px;top:10px;display:flex;gap:6px;z-index:3;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.pill{height:36px;border-radius:18px;border:1px solid var(--line);background:rgba(255,253,250,.95);padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;box-shadow:0 2px 10px rgba(60,40,20,.08)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#issues{position:absolute;left:12px;top:40px;z-index:4;height:32px;font-size:12px}
#issues.ok{color:var(--ok)}#issues.warn{color:var(--warn)}#issues.bad{color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
#drawbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:8px 10px;display:none;gap:8px;align-items:center;z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:12.5px;white-space:nowrap}
#drawbar.show{display:flex}
#drawbar input{width:84px;height:34px;border-radius:9px;border:0;padding:0 8px;color:var(--ink);text-align:right}
#drawbar button{height:34px;min-width:34px;border-radius:9px;border:0;background:rgba(255,255,255,.14);color:#fff;padding:0 9px}
#drawbar button.ok{background:#fff;color:var(--ink);font-weight:600}
#joy{position:absolute;left:26px;bottom:90px;width:124px;height:124px;border-radius:50%;background:rgba(255,253,250,.55);border:1px solid rgba(120,100,80,.25);display:none;z-index:4;touch-action:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#joy.show{display:block}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--ink);opacity:.85;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#joy small{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--muted)}
.overlay3d[hidden]{display:none!important}.overlay3d{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);background:var(--canvas);z-index:5;text-align:center;padding:30px}
.empty{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;z-index:2;max-width:360px;background:rgba(255,253,250,.94);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(60,40,20,.1)}
.empty h4{font:600 22px "Cormorant Garamond",serif;margin:0 0 6px}
.empty p{color:var(--muted);margin:0 0 14px;font-size:13px}
/* properties */
.ph{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ph .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ph input.title{width:100%;border:0;background:none;font:600 20px "Cormorant Garamond",Georgia,serif;padding:2px 0;outline:none}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec h5{margin:0 0 9px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
.f .in{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;height:38px;padding:0 8px;gap:4px}
.f .in:focus-within{border-color:var(--accent)}
.f input,.f select,.f textarea{border:0;outline:none;background:none;width:100%;min-width:0;color:var(--ink);font-size:13.5px}
.f textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;min-height:64px;resize:vertical}
.f em{font-style:normal;font-size:11px;color:var(--muted)}
.f.full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{border-radius:12px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.status.l0{background:#EEF4EC;color:#3f6b40}.status.l1{background:#FBF1DE;color:#8a5f14}.status.l2{background:#F8E4E0;color:#8f3125}
.status b{font-weight:600}
.note{font-size:11.5px;color:var(--muted);line-height:1.45}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sw button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.colorrow{display:flex;gap:8px;align-items:center}
.colorrow input[type=color]{width:42px;height:38px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff}
.optgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:36px;font-size:12px;padding:4px}
.opt.on{border-color:var(--ink);background:var(--ink);color:#fff}
input[type=range]{width:100%;accent-color:var(--accent)}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}.kv span{color:var(--muted)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(43,37,34,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border-radius:20px;width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(40,25,10,.3)}
.mhead{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;flex:1;font:600 22px "Cormorant Garamond",Georgia,serif}
.mbody{padding:16px 18px;overflow-y:auto;touch-action:pan-y}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.pitem.cur{border-color:var(--accent)}
.pitem .nm{flex:1;min-width:0}.pitem .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pitem .nm small{color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}table.t td,table.t th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}table.t th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
#updbar{position:fixed;left:50%;top:66px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:12px;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px}#updbar.show{display:flex}#updbar button{height:36px;border:0;border-radius:10px;background:#fff;color:var(--ink);font-weight:600;padding:0 14px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:60;pointer-events:none;font-size:13px;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:100}
#boot .mark{font:600 34px "Cormorant Garamond",serif;letter-spacing:.2em}
#boot small{color:var(--muted);letter-spacing:.3em;font-size:10px}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:1000px){#main{grid-template-columns:1fr!important}aside{position:absolute;top:0;bottom:0;z-index:8;box-shadow:0 10px 40px rgba(0,0,0,.18)}#left{left:0;width:270px}#right{right:0;width:300px}.savestate span,.brand .sub{display:none}.pname{max-width:120px}.seg button{padding:0 9px}}
@media (max-width:700px){.seg small{display:none}#app.v-split #stage{grid-template-columns:1fr;grid-template-rows:1fr 1fr}#app.v-split #pane2d{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div id="boot"><div class="mark">FIFTH HEIR</div><small>STUDIO</small><div class="spin"></div></div>
<div id="app" class="v-3d">
  <header>
    <button class="ib" id="bLeft" title="Biblioteca"></button>
    <div class="brand"><span class="mark">FIFTH HEIR</span><span class="sub">STUDIO</span></div>
    <button class="pname" id="pname" title="Cambiar nombre"></button>
    <span id="savestate" class="savestate"><i></i><span></span></span>
    <div class="grow"></div>
    <button class="ib" id="bUndo" title="Deshacer"></button>
    <button class="ib" id="bRedo" title="Rehacer"></button>
    <div class="seg" id="viewSeg">
      <button data-v="2d">2D</button><button data-v="split">2D + 3D</button><button data-v="3d">3D</button><button data-v="render" class="soon">Render <small>FASE 6</small></button>
    </div>
    <button class="ib" id="bProjects" title="Proyectos"></button>
    <button class="ib" id="bSave" title="Guardar ahora"></button>
    <button class="ib" id="bExport" title="Exportar"></button>
    <button class="ib" id="bSettings" title="Ajustes"></button>
    <button class="ib" id="bRight" title="Propiedades"></button>
  </header>
  <div id="main">
    <aside id="left">
      <div class="lhead"><input class="search" id="search" placeholder="Buscar mueble, referencia…" autocomplete="off"></div>
      <div class="cats" id="cats"></div>
      <div class="scroll"><div class="lib" id="lib"></div></div>
    </aside>
    <section id="stage">
      <div class="pane" id="pane2d">
        <div class="ptitle">Plano 2D</div>
        <svg id="plan" xmlns="http://www.w3.org/2000/svg"><g id="world"></g></svg>
        <div id="drawbar"></div>
        <div class="dock" id="dock2d"></div>
        <div id="empty2d"></div>
      </div>
      <div class="pane" id="pane3d">
        <div class="ptitle" id="t3d">Vista 3D</div>
        <div id="gl"></div>
        <div class="topright" id="tr3d"></div>
        <div id="joy"><i></i><small>Caminar</small></div>
        <div class="dock" id="dock3d"></div>
        <div id="ov3d" class="overlay3d" hidden></div>
      </div>
      <button class="pill" id="issues"></button>
    </section>
    <aside id="right"><div class="scroll" id="props"></div></aside>
  </div>
</div>
<div id="modal" hidden><div class="mbox"><div class="mhead"><h3 id="mtitle"></h3><button class="ib" id="mclose"></button></div><div class="mbody" id="mbody"></div><div class="mfoot" id="mfoot"></div></div></div>
<div id="toast"></div>
<div id="updbar"><span>Hay una versión nueva de Fifth Heir Studio</span><button id="updbtn">Actualizar</button></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script>
'use strict';
/* =====================================================================
   FIFTH HEIR STUDIO — prototipo v0.1
   Un único modelo de datos (PROJ) del que se derivan el plano 2D (SVG)
   y la escena 3D (Three.js). Unidades internas: centímetros.
   Ejes: x a la derecha, y hacia abajo en planta. En 3D: X=x, Z=y, Y=altura.
   ===================================================================== */
const APP_VERSION='0.2.1';
const THREE_URL='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=s=>document.querySelector(s);
const uid=p=>p+'_'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const D2R=Math.PI/180;
const r1=v=>Math.round(v*10)/10;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const hexOk=h=>/^#[0-9a-fA-F]{6}$/.test(h||'');
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))])}
function mix(a,b,t){if(!hexOk(a))a='#cccccc';if(!hexOk(b))b='#ffffff';const pa=[1,3,5].map(i=>parseInt(a.slice(i,i+2),16)),pb=[1,3,5].map(i=>parseInt(b.slice(i,i+2),16));return '#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function parseLen(str){if(typeof str==='number')return str;const s=String(str).trim().toLowerCase().replace(',','.');const m=s.match(/^(-?\d+(?:\.\d+)?)\s*(mm|cm|m)?$/);if(!m)return NaN;const v=parseFloat(m[1]);const u=m[2]||'cm';return u==='m'?v*100:u==='mm'?v/10:v}
function fmtNum(v){return String(r1(v)).replace('.',',')}
function fmtLen(cm){const u=PROJ&&PROJ.settings.units;if(u==='m')return (cm/100).toFixed(2).replace('.',',')+' m';return fmtNum(cm)+' cm'}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

/* ---------------- Iconos ---------------- */
const IC={
undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',

function newProject(name){return{format:'fifthheir.project',version:1,app:APP_VERSION,id:uid('p'),name,createdAt:Date.now(),updatedAt:Date.now(),notes:'',settings:clone(DEFAULT_SETTINGS),walls:[],openings:[],items:[],catalog:[],cameras:[]}}
const num=(v,d)=>{const n=+v;return Number.isFinite(n)?n:d};
const pos=(v,d)=>{const n=+v;return Number.isFinite(n)&&n>0?n:d};
function deepMerge(a,b){const o=clone(a);for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&o[k]&&typeof o[k]==='object')o[k]=deepMerge(o[k],b[k]);else if(k in o&&typeof b[k]===typeof o[k])o[k]=b[k]}return o}
function normItem(o){const cd=CATDEF[o.cat]||CATDEF.deco;return{id:typeof o.id==='string'?o.id:uid('i'),libId:o.libId||null,catalogId:o.catalogId||null,name:String(o.name||'Elemento').slice(0,120),cat:CATDEF[o.cat]?o.cat:'deco',glyph:String(o.glyph||cd.glyph),
 x:num(o.x,0),y:num(o.y,0),w:pos(o.w,50),d:pos(o.d,50),h:pos(o.h,50),rot:((num(o.rot,0)%360)+360)%360,elev:Math.max(0,num(o.elev,0)),
 color:hexOk(o.color)?o.color:cd.color,material:String(o.material??cd.material??''),finish:String(o.finish||''),
 brand:String(o.brand||''),ref:String(o.ref||''),url:String(o.url||''),price:o.price===null||o.price===''||o.price===undefined?null:num(o.price,null),currency:String(o.currency||'EUR'),checkedAt:o.checkedAt||null,
 source:o.source==='manual'?'manual':'generic',verified:!!o.verified,collides:o.collides===undefined?!!cd.collides:!!o.collides,mount:['floor','wall','ceiling'].includes(o.mount)?o.mount:(cd.mount||'floor'),
 access:o.access===undefined?(cd.access||null):o.access,ak:o.ak||cd.ak||'walk',round:!!o.round,full:!!o.full,light:o.light===undefined?!!cd.light:!!o.light,lightOn:o.lightOn!==false,power:num(o.power,1),kelvin:num(o.kelvin,2700),inList:o.inList!==false}}
function normalizeProject(p){
 if(!p||typeof p!=='object')throw new Error('El archivo no contiene un proyecto.');
 if(p.format!=='fifthheir.project')throw new Error('Formato desconocido: se esperaba «fifthheir.project».');
 const o=newProject(String(p.name||'Proyecto').slice(0,140));
 if(typeof p.id==='string'&&/^[A-Za-z0-9_-]{3,60}$/.test(p.id))o.id=p.id;
 o.createdAt=num(p.createdAt,Date.now());o.updatedAt=num(p.updatedAt,Date.now());o.notes=String(p.notes||'').slice(0,4000);
 o.settings=deepMerge(DEFAULT_SETTINGS,p.settings||{});
 o.walls=(Array.isArray(p.walls)?p.walls:[]).filter(w=>w&&[w.x1,w.y1,w.x2,w.y2].every(v=>Number.isFinite(+v))).map(w=>({id:typeof w.id==='string'?w.id:uid('w'),x1:+w.x1,y1:+w.y1,x2:+w.x2,y2:+w.y2,thickness:pos(w.thickness,15),height:pos(w.height,250),kind:w.kind==='partition'?'partition':'wall',color:hexOk(w.color)?w.color:null,finish:WALLF[w.finish]?w.finish:null}));
 const wid=new Set(o.walls.map(w=>w.id));
 o.openings=(Array.isArray(p.openings)?p.openings:[]).filter(q=>q&&wid.has(q.wallId)).map(q=>({id:typeof q.id==='string'?q.id:uid('o'),wallId:q.wallId,type:q.type==='window'?'window':'door',offset:Math.max(0,num(q.offset,0)),width:pos(q.width,80),height:pos(q.height,q.type==='window'?120:203),sill:Math.max(0,num(q.sill,q.type==='window'?90:0)),hinge:q.hinge==='end'?'end':'start',swing:q.swing===-1?-1:1,leaf:q.leaf!==false}));
 o.items=(Array.isArray(p.items)?p.items:[]).filter(Boolean).map(normItem);
 o.catalog=(Array.isArray(p.catalog)?p.catalog:[]).filter(Boolean).map(c=>({id:typeof c.id==='string'?c.id:uid('c'),manufacturer:String(c.manufacturer||''),name:String(c.name||'Mueble'),ref:String(c.ref||''),url:String(c.url||''),cat:CATDEF[c.cat]?c.cat:'deco',w:pos(c.w,50),d:pos(c.d,50),h:pos(c.h,50),price:c.price===null||c.price===''||c.price===undefined?null:num(c.price,null),currency:String(c.currency||'EUR'),checkedAt:c.checkedAt||null,verified:!!c.verified}));
 o.cameras=(Array.isArray(p.cameras)?p.cameras:[]).filter(Boolean).slice(0,30).map(c=>({id:c.id||uid('v'),name:String(c.name||'Vista'),mode:c.mode==='eye'?'eye':'orbit',orb:c.orb&&typeof c.orb==='object'?{tx:num(c.orb.tx,0),ty:num(c.orb.ty,0),tz:num(c.orb.tz,0),r:pos(c.orb.r,800),th:num(c.orb.th,1),ph:num(c.orb.ph,1)}:null,eye:c.eye&&typeof c.eye==='object'?{x:num(c.eye.x,0),z:num(c.eye.z,0),y:num(c.eye.y,160),yaw:num(c.eye.yaw,0),pitch:num(c.eye.pitch,0)}:null}));
 return o;
}

const getItem=id=>PROJ.items.find(i=>i.id===id);
const getWall=id=>PROJ.walls.find(w=>w.id===id);

function selObj(){if(!ui.sel)return null;const s=ui.sel;return s.kind==='item'?getItem(s.id):s.kind==='wall'?getWall(s.id):s.kind==='opening'?getOpening(s.id):null}
function select(kind,id){ui.sel=kind?{kind,id}:null;render2D();renderProps();update3DSelection()}

function updUndo(){$('#bUndo').disabled=!ui.undo.length;$('#bRedo').disabled=!ui.redo.length}
function commit(opts){if(PROJ){const hw=PROJ.walls.length>0;if(hw&&!ui.hadWalls){requestAnimationFrame(()=>{frame3D();if(ui.mode!=='3d')fitView()})}ui.hadWalls=hw}ui.analysis=analyze();render2D();if(!opts||!opts.keepPanel)renderProps();scheduleSave();mark3DDirty();updUndo();updIssues();renderEmpty()}

/* ---------------- Geometría ---------------- */
function snapV(v){const S=PROJ.settings;return S.snap?Math.round(v/S.grid)*S.grid:r1(v)}
function roomHeightSafe(){try{return PROJ?roomHeight():250}catch(e){return 250}}
function roomHeight(){const ws=PROJ.walls.filter(w=>w.kind==='wall');return ws.length?Math.min(...ws.map(w=>w.height)):PROJ.settings.wallHeight}
